<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- ICU Clinical Notes v7: GitHub-hosted UI assets served by Apps Script + local OCR -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root{
      --bg:#f4f7fb;--panel:#fff;--ink:#152033;--muted:#667085;--line:#d8e0ea;
      --primary:#244a75;--primary2:#173653;--soft:#eaf1f8;--danger:#a33a3a;--warn:#8a5a13;
      --radius:14px;--shadow:0 4px 20px rgba(26,44,68,.08)
    }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,textarea,select{font:inherit} button{cursor:pointer}
    .appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
    .brand{font-weight:800;font-size:18px;white-space:nowrap}.user{margin-left:auto;color:var(--muted);font-size:12px;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 52px)}
    .side{padding:14px;border-right:1px solid var(--line);background:#fbfcfe}.side h4{margin:4px 4px 10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .area-btn{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;margin:2px 0;color:var(--ink)}
    .area-btn.active,.area-btn:hover{background:var(--soft);color:var(--primary);font-weight:700}
    .main{padding:18px;max-width:1500px;width:100%;margin:0 auto}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar .spacer{flex:1}
    .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;font-weight:650}.btn:hover{background:#f8fafc}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary2)}
    .btn.danger{color:var(--danger);border-color:#e7baba}.btn.small{padding:6px 9px;font-size:12px}.btn.ghost{border:0;background:transparent;color:var(--primary)}
    .search{min-width:260px;max-width:520px;width:34vw;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px}
    .section-title{display:flex;align-items:end;gap:10px;margin:8px 0 12px}.section-title h2{margin:0;font-size:22px}.count{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}.card h3{margin:0 0 4px;font-size:17px}.meta{color:var(--muted);font-size:12px}.diag{margin:10px 0 6px;font-size:13px}.problems{font-size:12px;color:#38465a;white-space:pre-wrap;max-height:4.8em;overflow:hidden}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
    .badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:var(--soft);color:var(--primary);font-weight:750;font-size:11px}.badge.draft{background:#fff2d6;color:var(--warn)}.badge.signed{background:#e8f5ed;color:#28613e}
    .patient-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}.patient-head h2{margin:0 0 4px}.patient-head .right{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
    .tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:12px}.tab{border:0;background:transparent;padding:10px 12px;color:var(--muted);font-weight:700;border-bottom:2px solid transparent}.tab.active{color:var(--primary);border-color:var(--primary)}
    .note-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:start}.note-type{font-weight:800}.note-preview{color:#415066;font-size:13px;white-space:pre-wrap;max-height:4.2em;overflow:hidden}
    .form{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}.review-header{position:sticky;top:52px;z-index:12;background:#eef4fa;border:1px solid #cad9e8;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:800;box-shadow:0 2px 8px rgba(26,44,68,.06)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#445267}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.field textarea.tall{min-height:125px}
    .system-title{margin:18px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--primary)}
    .sticky-actions{position:sticky;bottom:0;z-index:15;background:rgba(244,247,251,.94);backdrop-filter:blur(8px);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:14px}
    .modal-back{position:fixed;inset:0;z-index:100;background:rgba(8,18,32,.48);display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;border-radius:16px;box-shadow:0 18px 70px rgba(0,0,0,.22);width:min(760px,96vw);max-height:92vh;overflow:auto}.modal.wide{width:min(1050px,98vw)}.modal-head{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:3}.modal-head h3{margin:0}.modal-body{padding:16px}.modal-foot{position:sticky;bottom:0;background:#fff;padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;z-index:3}
    .checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
    .toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#152033;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:420px}.toast.err{background:#7a2626}
    .empty{padding:36px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
    .danger-note{padding:10px;border:1px solid #edc7c7;background:#fff5f5;border-radius:10px;color:#743232;font-size:12px}
    .print-root{display:none}
    @media (max-width:850px){.shell{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.side h4{display:none}.area-btn{width:auto;white-space:nowrap;padding:8px 10px}.main{padding:12px}.search{width:100%;max-width:none;min-width:0}.toolbar{align-items:stretch}.toolbar .spacer{display:none}.form-grid{grid-template-columns:1fr}.note-row{grid-template-columns:1fr}.patient-head .right{margin-left:0}.appbar{padding:9px 11px}.brand{font-size:15px}.user{font-size:10px}.checkgrid{grid-template-columns:1fr}}
    @media print{
      body *{visibility:hidden!important}.print-root,.print-root *{visibility:visible!important}.print-root{display:block!important;position:absolute;inset:0;background:#fff;color:#000;padding:0;font-family:Arial,sans-serif}.print-note{padding:8mm 10mm;font-size:10.5pt}.print-note h1{text-align:center;font-size:14pt;margin:0 0 8px}.print-head{display:grid;grid-template-columns:1fr 1fr;border:1px solid #000;margin-bottom:8px}.print-head div{padding:4px;border-bottom:1px solid #000}.print-head div:nth-child(odd){border-right:1px solid #000}.print-section{margin:6px 0}.print-section h4{margin:0 0 2px;font-size:9.5pt}.print-section pre{white-space:pre-wrap;font:inherit;margin:0}.print-sign{margin-top:14px;font-size:9pt}.print-userid.hide{display:none!important}
    }
  
    .hidden{display:none!important}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,#eef4fa,#f7f9fc)}
    .auth-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px}
    .auth-card h1{font-size:23px;margin:0 0 6px}.auth-card p{color:var(--muted);font-size:13px;line-height:1.45}
    .auth-card .field{margin:11px 0}.auth-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .auth-note{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:#536174;margin-top:12px}
    .bottom-nav{display:none}
    .handover-toolbar{position:sticky;top:52px;z-index:15;background:var(--bg);padding:8px 0 10px}
    .handover-group{margin:14px 0}.handover-group-title{position:sticky;top:112px;z-index:10;background:#eaf1f8;border-radius:9px;padding:8px 10px;font-weight:800;color:var(--primary)}
    .handover-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;margin-top:9px}
    .handover-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:0 2px 10px rgba(26,44,68,.06)}
    .handover-card .identity{display:flex;gap:8px;align-items:flex-start}.handover-card h3{margin:0;font-size:16px}
    .handover-card .loc{font-size:12px;font-weight:800;color:var(--primary)}
    .handover-section{margin-top:8px;padding-top:7px;border-top:1px solid #edf1f5;font-size:12px;white-space:pre-wrap;line-height:1.35}
    .handover-section b{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#667085;margin-bottom:3px}
    .latest-entry{background:#f7f9fc;border-radius:9px;padding:8px;margin-top:8px}
    .fresh{color:#28613e}.stale{color:#9a5a10;font-weight:700}
    .ocr-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #b9cde1;background:#f2f7fc;color:var(--primary);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:750}
    .ocr-preview{white-space:pre-wrap;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fbfcfe;font-size:12px}
    .ocr-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;padding:9px;border:1px dashed #b8c8d8;border-radius:10px;background:#f7fafc}
    @media (max-width:850px){
      body{padding-bottom:62px}
      .bottom-nav{position:fixed;display:grid;grid-template-columns:repeat(3,1fr);left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:5px max(6px,env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
      .bottom-nav button{border:0;background:transparent;padding:7px 4px;font-size:11px;color:#526174}.bottom-nav button b{display:block;font-size:17px;color:var(--primary);line-height:1.1}
      .handover-list{grid-template-columns:1fr;gap:8px}.handover-card{border-radius:10px;padding:10px}.handover-card h3{font-size:15px}
      .handover-toolbar{top:48px}.handover-group-title{top:110px}
      .mobile-hide{display:none!important}
    }

    .ocr-source-wrap{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#101820;min-height:260px;display:grid;place-items:center}
    .ocr-source-wrap img{display:block;max-width:100%;max-height:54vh}
    .ocr-controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
    .ocr-progressbar{height:8px;background:#e8edf3;border-radius:999px;overflow:hidden;margin-top:8px}.ocr-progressbar>div{height:100%;width:0;background:var(--primary);transition:width .2s}
    .ocr-previews{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.ocr-previews figure{margin:0}.ocr-previews figcaption{font-size:11px;color:var(--muted);margin-bottom:4px}.ocr-previews canvas,.ocr-previews img{width:100%;max-height:300px;object-fit:contain;border:1px solid var(--line);border-radius:9px;background:#fff}
    .ocr-memory-note{font-size:11px;color:#536174;margin-top:7px}
    @media(max-width:700px){.ocr-previews{grid-template-columns:1fr}.ocr-source-wrap{min-height:220px}}

  </style>
</head>
<body>
  <div id="authRoot" class="auth-wrap"><div class="auth-card">
    <h1>ICU Clinical Notes</h1>
    <p>Starting application…</p>
    <div class="auth-note" id="startupStatus">Frontend loaded. Preparing login…</div>
  </div></div>

  <div id="appRoot" class="hidden">
    <header class="appbar">
      <div class="brand" id="brand">ICU Clinical Notes</div>
      <button class="btn small ghost mobile-hide" onclick="goDashboard()">Patients</button>
      <button class="btn small ghost mobile-hide" onclick="goHandover()">Handover</button>
      <div class="user" id="userId"></div>
      <button class="btn small" onclick="logout()">Logout</button>
    </header>
    <div class="shell">
      <aside class="side" id="areaNav"></aside>
      <main class="main" id="main"><div class="empty">Loading…</div></main>
    </div>
    <nav class="bottom-nav">
      <button onclick="goDashboard()"><b>⌂</b>Patients</button>
      <button onclick="goHandover()"><b>⇄</b>Handover</button>
      <button onclick="openSearchMobile()"><b>⌕</b>Search</button>
    </nav>
  </div>

  <div id="modalHost"></div>
  <div id="ocrHost"></div>
  <div id="toastHost"></div>
  <div class="print-root" id="printRoot"></div>

<script src="__ICU_APP_JS_URL__"></script>
</body>
</html>
